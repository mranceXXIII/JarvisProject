# JARVIS application settings (non-secret only).
# Secrets must never be placed in this file. See JARVIS_Project_Context.md 5.9.

app:
  name: JARVIS
  # What to show at launch: "dashboard", "tray", or "both"
  startup_mode: both
  dashboard_enabled: true
  tray_enabled: true
  # Directory (relative to project root) for local data such as future databases
  data_dir: data

logging:
  level: INFO
  file: logs/jarvis.log
  max_bytes: 1048576
  backup_count: 5

research:
  # Web research (Phase 7). Fetching is read-only; page content is treated
  # as untrusted data and never as instructions (spec section 10).
  enabled: true
  timeout_seconds: 20
  max_page_bytes: 524288   # 512 KiB per page
  max_search_results: 5
  max_report_pages: 5

gmail:
  # Gmail integration (Phase 8). Requires one-time OAuth setup - see
  # docs/GOOGLE_GMAIL_SETUP.md. The refresh token is stored in the Windows
  # Credential Manager, never in files. Sending always requires approval.
  enabled: false
  client_secrets_file: config/google_client_secret.json
  token_credential_ref: jarvis/gmail-token
  max_results: 10
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.compose
    - https://www.googleapis.com/auth/gmail.send

telegram:
  # Telegram messaging (Phase 9). Requires a bot token from @BotFather -
  # see docs/TELEGRAM_SETUP.md. Token lives in the Credential Manager.
  # NOTE: bots can only read messages sent to them/in their groups after
  # activation - Telegram bots cannot read arbitrary chat history.
  enabled: false
  bot_token_ref: jarvis/telegram-bot-token
  poll_timeout_seconds: 5
  max_messages: 10

discord:
  # Discord messaging (Phase 9). Requires a bot token from the Discord
  # Developer Portal - see docs/DISCORD_SETUP.md. The bot must be invited
  # to your server with the Message Content intent enabled.
  enabled: false
  bot_token_ref: jarvis/discord-bot-token
  max_messages: 10
  api_base: https://discord.com/api/v10

voice:
  # Voice features are OPTIONAL. Engines load lazily; if a dependency
  # (sounddevice, faster-whisper, pyttsx3, pvporcupine) is missing, that
  # engine reports "unavailable" and JARVIS stays usable in text mode.
  enabled: false
  wake_phrase: jarvis
  wake_credential_ref: jarvis/picovoice-access-key
  input_device: null
  sample_rate: 16000
  frame_duration: 0.03
  inactivity_timeout_seconds: 120
  stt_model: base
  tts_enabled: true
  tts_rate: 180
