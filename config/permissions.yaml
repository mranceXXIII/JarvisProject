# JARVIS permission policy (spec sections 9, 16).
#
# Risk classification is declared per tool in the tool registry:
#   low    : reading memory, listing apps, opening registered applications
#   medium : modifying files/settings, running approved scripts, messages
#   high   : deletion, purchases, public posting, sharing private data
#
# require_approval_medium / require_approval_high: show an approval dialog
#   before executing such tools (approval-first architecture).
# trusted_tools: tool names that skip approval entirely. Use sparingly --
#   a trusted tool executes without asking, every time.

permissions:
  require_approval_medium: true
  require_approval_high: true
  trusted_tools: []

# File tools may only touch paths inside these roots (expanded with ~).
# Paths outside them are refused regardless of approval.
file_access:
  allowed_roots: ["~/Documents", "~/Desktop", "~/Downloads"]
  max_read_bytes: 1048576
  max_list_entries: 200

# Command runner: high-risk tool with a strict allowlist. Only these
# executables can ever run, always without a shell, with a timeout and an
# output cap. Extend deliberately.
command_runner:
  allowed_executables: ["ipconfig", "ping", "systeminfo"]
  timeout_seconds: 30
  max_output_chars: 4000
